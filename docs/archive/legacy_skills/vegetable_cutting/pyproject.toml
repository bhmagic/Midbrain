[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "midbrain-vegetable-cutting-skill"
version = "0.3.0"
description = "Supervised Midbrain Skill for visual vegetable-cut planning and MIT execution"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "python-dotenv>=1.0,<2",
  "numpy>=2.0,<3",
  "midbrain-spatial-registration-rgbd>=0.1,<0.2",
  "opencv-python-headless>=4.10,<5",
  "Pillow>=10,<13",
  "pytest>=8,<10"
]

[project.scripts]
vegetable-cutting-gui = "vegetable_cutting.app:main"

[tool.setuptools.packages.find]
where = ["python"]
include = ["vegetable_cutting*"]

[tool.setuptools.package-data]
vegetable_cutting = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
