[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "physical-agent-test-scaffold"
version = "0.4.15"
description = "Physical agent test UI for inertial-first VIO, startup space cognition, and world RGB-D visualization"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "midbrain-bufferref-client>=0.1,<0.2",
  "openai-agents>=0.4,<1",
  "google-genai>=1.0,<2",
  "python-dotenv>=1.0,<2",
  "jsonschema>=4.23,<5",
  "Pillow>=10,<13",
  "numpy>=2.0,<3",
  "opencv-python-headless>=4.10,<5",
  "orbbec-femto-provider>=0.4.0,<0.5"
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["."]
include = ["physical_agent_test*"]

[tool.setuptools.package-data]
physical_agent_test = ["web/*.html", "web/*.js"]
