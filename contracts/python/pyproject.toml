[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "midbrain-bufferref-client"
version = "0.1.0"
description = "Provider-neutral Windows BufferRef consumer for Midbrain"
requires-python = ">=3.11,<3.13"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.3,<9"]

[tool.setuptools.packages.find]
where = ["."]
include = ["midbrain_bufferref*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
