[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "midbrain-slicing-skill"
version = "0.2.0"
description = "Profile-driven finite three-stroke slicing Skill for Midbrain"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3",
  "midbrain-contact-work-runtime>=0.1,<0.2"
]

[tool.setuptools.packages.find]
where = ["python"]
include = ["slicing_skill*"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
