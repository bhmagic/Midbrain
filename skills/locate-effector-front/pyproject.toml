[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "midbrain-locate-effector-front"
version = "0.2.0"
description = "Depth-reliable general effector-front localization for Midbrain"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3",
  "midbrain-spatial-registration-rgbd>=0.2,<0.3"
]

[tool.setuptools.packages.find]
where = ["python"]
include = ["locate_effector_front*"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
