[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "midbrain-limited-graph-skill"
version = "0.1.1"
description = "Bounded graph orchestration for finite Midbrain Skills"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.23,<5"
]

[tool.setuptools.packages.find]
where = ["python"]
include = ["limited_graph*"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
