[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "midbrain-register-tool-to-control-frame"
version = "0.1.0"
description = "Review-only VLM and RGB-D tool-to-control-frame registration for Midbrain"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3",
  "midbrain-spatial-registration-rgbd>=0.1,<0.2"
]

[tool.setuptools.packages.find]
where = ["python"]
include = ["register_tool_to_control_frame*"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
