[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "midbrain-locate-arm-base"
version = "1.10.1"
description = "Finite Midbrain skill for CAD-based arm-base localization"
requires-python = ">=3.11,<3.13"
dependencies = [
  "httpx>=0.27,<1",
  "midbrain-bufferref-client>=0.1,<0.2",
  "numpy>=2.1,<3",
  "Pillow>=11,<12"
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9"]

[project.scripts]
locate-arm-base = "locate_arm_base.cli:main"

[tool.setuptools.packages.find]
where = ["python"]
include = ["locate_arm_base*"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
