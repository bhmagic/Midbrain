[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "midbrain-move-carried-object-skill"
version = "0.1.0"
description = "Finite Contact-only motion Skill for an already carried object"
requires-python = ">=3.11"
dependencies = ["midbrain-grip-work-runtime>=0.1,<0.2"]

[tool.setuptools.packages.find]
where = ["python"]
include = ["move_carried_object_skill*"]
