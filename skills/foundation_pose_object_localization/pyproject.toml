[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "midbrain-foundation-pose-object-localization-skill"
version = "0.1.0"
description = "Finite Midbrain FoundationPose object-localization Skill runtime"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3"
]

[tool.setuptools.packages.find]
where = ["python"]
include = ["foundation_pose_object_localization*"]
