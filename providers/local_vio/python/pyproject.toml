[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "physical-ai-local-vio-provider"
version = "0.4.1"
description = "Inertial-first RGB-D visual-inertial Resource Provider with optional IR/depth corrections"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "numpy>=2.0,<3",
  "opencv-python-headless>=4.10,<5",
  "Pillow>=10,<13",
  "orbbec-femto-provider>=0.4.1,<0.5"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["local_vio_provider*"]
