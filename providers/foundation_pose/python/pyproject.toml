[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "physical-ai-foundation-pose-provider"
version = "0.4.0"
description = "CAD-conditioned RGB-D object-pose Resource Provider for Midbrain"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "httpx>=0.27,<1",
  "numpy>=2.0,<3",
  "opencv-python-headless>=4.10,<5",
  "orbbec-femto-provider>=0.4.0,<0.5"
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["."]
include = ["foundation_pose_provider*"]
