[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "midbrain-rebot-arm-contact"
version = "0.1.0"
description = "Independent reBot Contact Work Provider"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3"]

[tool.setuptools.packages.find]
where = ["."]
include = ["rebot_arm_contact*"]
