[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "physical-ai-arm-scene-compiler-provider"
version = "0.1.0"
description = "HOT semantic sphere scene compiler Resource Provider"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "numpy>=2.0,<3",
  "orbbec-femto-provider>=0.4.0,<0.5"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["arm_scene_compiler*"]
