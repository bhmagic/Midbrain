name: source-validation

on:
  push:
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest numpy httpx Pillow opencv-python-headless fastapi uvicorn python-dotenv
      - name: Run Python tests
        env:
          PYTHONPATH: providers/local_vio:providers/local_vio/python:providers/orbbec_femto_bolt:providers/orbbec_femto_bolt/python:skills/spatial_registration_rgbd/python:skills/vegetable_cutting/python:test_agent/python
        run: |
          python -m pytest -q \
            providers/orbbec_femto_bolt/python/tests \
            providers/local_vio/python/tests \
            skills/vegetable_cutting/python/tests \
            test_agent/python/tests

  rust-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform_core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test workspace
        run: cargo test --workspace
      - name: Build release
        run: cargo build --workspace --release
