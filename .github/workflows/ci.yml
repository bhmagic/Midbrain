name: source-validation

on:
  push:
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest numpy httpx Pillow opencv-python-headless fastapi uvicorn python-dotenv jsonschema openai-agents google-genai
      - name: Seed machine-local test configuration
        run: |
          mkdir -p providers/rebot_arm_dm/config
          cp providers/rebot_arm_dm/config_templates/arm_model.factory.json providers/rebot_arm_dm/config/arm_model.json
          cp providers/rebot_arm_dm/config_templates/arm_calibration.initial.json providers/rebot_arm_dm/config/arm_calibration.json
          cp providers/rebot_arm_dm/config_templates/calibration_collision_model.json providers/rebot_arm_dm/config/calibration_collision_model.json
          python - <<'PY'
          import json
          from pathlib import Path

          calibration = json.loads(
              Path("providers/rebot_arm_dm/config/arm_calibration.json").read_text(
                  encoding="utf-8"
              )
          )
          selection_path = Path(
              "config/robot_assemblies/primary_manipulator.example.json"
          )
          selection = json.loads(selection_path.read_text(encoding="utf-8"))
          selection["profiles"]["calibration"]["expected_revision"] = calibration[
              "calibration_revision"
          ]
          serialized = json.dumps(selection, indent=2) + "\n"
          selection_path.write_text(serialized, encoding="utf-8")
          Path("config/robot_assemblies/primary_manipulator.json").write_text(
              serialized,
              encoding="utf-8",
          )
          PY
      - name: Run Python tests
        env:
          PYTHONPATH: providers/local_vio:providers/local_vio/python:providers/orbbec_femto_bolt:providers/orbbec_femto_bolt/python:providers/rebot_arm_dm/python:providers/rebot_arm_integrated/python:providers/rebot_arm_contact/python:skills/contact_work_runtime/python:skills/slicing/python:skills/spatial_registration_rgbd/python:test_agent/python
        run: |
          python -m pytest -q --import-mode=importlib \
            providers/orbbec_femto_bolt/python/tests \
            providers/local_vio/python/tests \
            providers/rebot_arm_dm/python/tests \
            providers/rebot_arm_integrated/python/tests \
            providers/rebot_arm_contact/python/tests \
            skills/contact_work_runtime/python/tests \
            skills/slicing/python/tests \
            test_agent/python/tests

  rust-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform_core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test workspace
        run: cargo test --workspace
      - name: Build release
        run: cargo build --workspace --release
